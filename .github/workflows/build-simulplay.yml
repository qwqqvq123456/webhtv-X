name: Build SimulPlay APK

on:
  push:
    branches: [ main, beta ]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-simulplay.yml'
      - '.github/scripts/make_manifest.py'
      - '.github/scripts/verify_apk.py'
      - '.github/scripts/fetch_upstream_notes.py'
  workflow_dispatch:
    inputs:
      channel:
        description: '发布通道（stable 写正式清单，beta 写测试清单）'
        required: true
        default: stable
        type: choice
        options:
          - stable
          - beta
      flavor:
        description: '构建目标（all = 四个机型全量，与官方发布一致）'
        required: true
        default: all
        type: choice
        options:
          - all
          - mobile-arm64_v8a
          - leanback-arm64_v8a
          - mobile-armeabi_v7a
          - leanback-armeabi_v7a
      optimize:
        description: '启用 R8 压缩（体积更小，构建更慢）'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: build-${{ github.event.inputs.channel || github.ref_name }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
      channel: ${{ steps.version.outputs.channel }}
      suffix: ${{ steps.version.outputs.suffix }}
      tag: ${{ steps.version.outputs.tag }}
      version_name: ${{ steps.version.outputs.version_name }}
      version_source: ${{ steps.version.outputs.version_source }}
      flavors: ${{ steps.version.outputs.flavors }}
    steps:
      - name: Pick source branch
        id: ref
        run: |
          if [ -n "${{ github.event.inputs.channel }}" ]; then
            if [ "${{ github.event.inputs.channel }}" = "beta" ]; then REF=beta; else REF=main; fi
          else
            REF="${{ github.ref_name }}"
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "source ref: $REF"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.ref }}

      - name: Resolve channel and version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          CH="${{ github.event.inputs.channel }}"
          if [ -z "$CH" ]; then
            if [ "${{ github.ref_name }}" = "beta" ]; then CH=beta; else CH=stable; fi
          fi
          if [ "$CH" = "beta" ]; then SUFFIX=-beta; else SUFFIX=""; fi
          VN=$(grep -m1 'versionName' app/build.gradle | sed 's/.*"\([^"]*\)".*/\1/')

          # 版本号跟随上游：直接沿用上游同通道最新发布的 tag，这样「关于」页显示的版本
          # 与官方完全一致，而不是我们自己造一个比官方更晚的时间戳。
          # 只有在上游不可达、或上游版本号与本分支 build.gradle 不一致时才退回本地时间戳。
          UPSTREAM=Silent1566/webhtv
          if [ "$CH" = "beta" ]; then PRE='.isPrerelease == true'; else PRE='.isPrerelease == false'; fi
          TAG=""
          if command -v gh >/dev/null 2>&1; then
            TAG=$(gh release list --repo "$UPSTREAM" --limit 60 --json tagName,isPrerelease \
                  --jq "[.[] | select(.tagName | startswith(\"v\")) | select($PRE)][0].tagName // empty" \
                  2>/dev/null || true)
          fi
          if [ -n "$TAG" ] && [ "${TAG#v$VN}" = "$TAG" ]; then
            echo "upstream tag $TAG does not match local versionName $VN, ignoring it"
            TAG=""
          fi
          if [ -n "$TAG" ]; then
            VSOURCE=upstream
          else
            STAMP=$(TZ=Asia/Shanghai date +%Y%m%d%H%M)
            TAG="v${VN}${SUFFIX}-${STAMP}"
            VSOURCE=local
            echo "WARN: 未能取得上游版本号，退回本地时间戳 $TAG"
          fi

          # 机型列表：默认四个全量，手动指定时只构建一个
          WANT="${{ github.event.inputs.flavor }}"
          if [ -z "$WANT" ] || [ "$WANT" = "all" ]; then
            FLAVORS='["mobile-arm64_v8a","leanback-arm64_v8a","mobile-armeabi_v7a","leanback-armeabi_v7a"]'
          else
            FLAVORS="[\"${WANT}\"]"
          fi

          echo "channel=$CH" >> "$GITHUB_OUTPUT"
          echo "suffix=$SUFFIX" >> "$GITHUB_OUTPUT"
          echo "version_name=$VN" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version_source=$VSOURCE" >> "$GITHUB_OUTPUT"
          echo "flavors=$FLAVORS" >> "$GITHUB_OUTPUT"
          echo "=== channel=$CH version=$TAG (source=$VSOURCE) flavors=$FLAVORS"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        flavor: ${{ fromJson(needs.prepare.outputs.flavors) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Map flavor to gradle task
        id: target
        run: |
          set -e
          case "${{ matrix.flavor }}" in
            mobile-arm64_v8a)     TASK=assembleMobileArm64_v8aRelease;   OUT=mobileArm64_v8a ;;
            leanback-arm64_v8a)   TASK=assembleLeanbackArm64_v8aRelease; OUT=leanbackArm64_v8a ;;
            mobile-armeabi_v7a)   TASK=assembleMobileArmeabi_v7aRelease; OUT=mobileArmeabi_v7a ;;
            leanback-armeabi_v7a) TASK=assembleLeanbackArmeabi_v7aRelease; OUT=leanbackArmeabi_v7a ;;
            *) echo "unknown flavor: ${{ matrix.flavor }}"; exit 1 ;;
          esac
          echo "task=$TASK" >> "$GITHUB_OUTPUT"
          echo "out=$OUT" >> "$GITHUB_OUTPUT"
          echo "manifest=${{ matrix.flavor }}${{ needs.prepare.outputs.suffix }}.json" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Android SDK packages
        run: |
          set -e
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "ANDROID_HOME=$SDK"
          SM="$(command -v sdkmanager || true)"
          if [ -z "$SM" ]; then
            SM="$(find "$SDK/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          fi
          echo "sdkmanager=$SM"
          test -n "$SM"
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          "$SM" "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Configure signing
        id: sign
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "缺少 KEYSTORE_BASE64，无法生成稳定签名的安装包"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/simulplay.jks"
          {
            echo "sdk.dir=${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
            echo "storeFile=$RUNNER_TEMP/simulplay.jks"
            echo "keyAlias=${{ secrets.KEY_ALIAS }}"
            echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
          } > local.properties
          sed 's/storePassword=.*/storePassword=***/' local.properties
          SHA=$(keytool -list -v -keystore "$RUNNER_TEMP/simulplay.jks" \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" -alias "${{ secrets.KEY_ALIAS }}" \
            | sed -n 's/.*SHA256: //p' | head -n 1)
          echo "keystore SHA256: $SHA"
          echo "signer_sha256=$SHA" >> "$GITHUB_OUTPUT"

      - name: Build APK (${{ matrix.flavor }})
        env:
          WEBHTV_RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          WEBHTV_APK_SUFFIX: ${{ needs.prepare.outputs.suffix }}
        run: |
          set -e
          EXTRA=""
          if [ "${{ github.event.inputs.optimize }}" != "true" ]; then EXTRA="-PfastRelease=true"; fi
          echo "gradle args: $EXTRA"
          bash gradlew ${{ steps.target.outputs.task }} $EXTRA --no-daemon --stacktrace

      - name: Fetch upstream release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/fetch_upstream_notes.py \
            --channel "${{ needs.prepare.outputs.channel }}" \
            --out upstream-notes.md
          echo "--- upstream-notes.md ---"
          head -c 400 upstream-notes.md || true

      - name: Make update manifest
        id: manifest
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
          MANIFEST: ${{ steps.target.outputs.manifest }}
          VERSION_NAME: ${{ needs.prepare.outputs.version_name }}
        run: |
          set -e
          APK=$(find "app/build/outputs/apk/${{ steps.target.outputs.out }}/release" -name '*.apk' | head -n 1)
          test -n "$APK"
          echo "apk=$APK"
          AAPT=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -type f -name aapt2 | sort | tail -n 1)
          CODE=$("$AAPT" dump badging "$APK" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -n 1)
          echo "versionCode=$CODE"
          {
            echo "本构建：官方 ${TAG}（版本号与官方一致）+ 同时播放补丁（画中画切到其他 App 不再暂停）· 构建提交 ${GITHUB_SHA:0:7} · $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M') 北京时间"
            if [ -s upstream-notes.md ]; then
              echo
              cat upstream-notes.md
            fi
          } > release-notes.md
          python3 .github/scripts/make_manifest.py \
            --apk "$APK" \
            --channel "$CHANNEL" \
            --tag "$TAG" \
            --version-name "$VERSION_NAME" \
            --code "$CODE" \
            --repo "${GITHUB_REPOSITORY}" \
            --notes-file release-notes.md \
            --out "$MANIFEST"
          cat "$MANIFEST"
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "size=$(du -h "$APK" | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Verify APK (signature, version and update URL)
        env:
          APK: ${{ steps.manifest.outputs.apk_path }}
        run: |
          set -e
          python3 .github/scripts/verify_apk.py \
            --apk "$APK" \
            --expect-sha256 "${{ steps.sign.outputs.signer_sha256 }}" \
            --expect-code "${{ steps.manifest.outputs.code }}" \
            --expect-version "${{ needs.prepare.outputs.version_name }}" \
            --expect-build-tag "${{ needs.prepare.outputs.tag }}"

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.flavor }}
          path: |
            ${{ steps.manifest.outputs.apk_path }}
            ${{ steps.target.outputs.manifest }}
            release-notes.md
          retention-days: 3
          if-no-files-found: error

  publish:
    needs: [ prepare, build ]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download all build outputs
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      - name: Show artifacts
        run: ls -lh dist

      - name: Publish release and update channel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
          REF: ${{ needs.prepare.outputs.ref }}
        run: |
          set -e
          if [ "$CHANNEL" = "beta" ]; then FLAG=--prerelease; else FLAG=--latest; fi
          APKS=$(ls dist/*.apk)
          MANIFESTS=$(ls dist/*.json)
          echo "apks: $APKS"
          echo "manifests: $MANIFESTS"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" $APKS $MANIFESTS --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file dist/release-notes.md $FLAG
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" $FLAG \
              --target "$REF" \
              --title "$TAG" \
              --notes-file dist/release-notes.md
            gh release upload "$TAG" $APKS $MANIFESTS --repo "$GITHUB_REPOSITORY" --clobber
          fi

          if gh release view update-channel --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "update-channel 已存在"
          else
            gh release create update-channel --repo "$GITHUB_REPOSITORY" --prerelease \
              --title "Update channel manifests" \
              --notes "App 内「检查更新」读取的清单目录，不对外提供安装包。"
          fi
          gh release upload update-channel $MANIFESTS --repo "$GITHUB_REPOSITORY" --clobber
          echo "published $TAG with $(echo "$APKS" | wc -l) apk(s) and $(echo "$MANIFESTS" | wc -l) manifest(s)"
