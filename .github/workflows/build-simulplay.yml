name: Build SimulPlay APK

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-simulplay.yml'
  workflow_dispatch:
    inputs:
      flavor:
        description: '构建目标'
        required: true
        default: 'mobile-arm64_v8a'
        type: choice
        options:
          - mobile-arm64_v8a
          - leanback-arm64_v8a
          - mobile-armeabi_v7a
          - leanback-armeabi_v7a

permissions:
  contents: write

concurrency:
  group: build-simulplay-${{ github.event.inputs.flavor || 'default' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Resolve build task
        id: pick
        run: |
          FLAVOR="${{ github.event.inputs.flavor }}"
          if [ -z "$FLAVOR" ]; then FLAVOR="mobile-arm64_v8a"; fi
          case "$FLAVOR" in
            mobile-arm64_v8a)      TASK="assembleMobileArm64_v8aDebug";   OUT="mobileArm64_v8a" ;;
            leanback-arm64_v8a)    TASK="assembleLeanbackArm64_v8aDebug"; OUT="leanbackArm64_v8a" ;;
            mobile-armeabi_v7a)    TASK="assembleMobileArmeabi_v7aDebug"; OUT="mobileArmeabi_v7a" ;;
            leanback-armeabi_v7a)  TASK="assembleLeanbackArmeabi_v7aDebug"; OUT="leanbackArmeabi_v7a" ;;
            *) echo "unknown flavor: $FLAVOR"; exit 1 ;;
          esac
          echo "task=$TASK" >> "$GITHUB_OUTPUT"
          echo "flavor=$FLAVOR" >> "$GITHUB_OUTPUT"
          echo "out=$OUT" >> "$GITHUB_OUTPUT"

      - name: Configure SDK path
        run: echo "sdk.dir=${ANDROID_HOME}" > local.properties

      - name: Build debug APK
        run: bash gradlew ${{ steps.pick.outputs.task }} --no-daemon --stacktrace

      - name: Collect APK
        id: apk
        run: |
          set -e
          APK=$(find "app/build/outputs/apk/${{ steps.pick.outputs.out }}/debug" -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then echo "APK not found"; exit 1; fi
          NAME="webhtv-simulplay-${{ steps.pick.outputs.flavor }}.apk"
          cp "$APK" "$NAME"
          ls -lh "$NAME"
          echo "path=$NAME" >> "$GITHUB_OUTPUT"
          echo "size=$(du -h "$NAME" | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Publish to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="simulplay-latest"
          gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1 || \
            gh release create "$TAG" --repo "${GITHUB_REPOSITORY}" \
              --prerelease \
              --title "同时播放版 · 自动构建" \
              --notes "自动构建产物：包含「同时播放」改动（不抢占音频焦点）。调试签名，安装前请卸载官方版本。"
          gh release upload "$TAG" "${{ steps.apk.outputs.path }}" --repo "${GITHUB_REPOSITORY}" --clobber
          gh release edit "$TAG" --repo "${GITHUB_REPOSITORY}" \
            --notes "自动构建（commit ${GITHUB_SHA:0:7}，$(date -u +%Y-%m-%dT%H:%MZ)）
          - 目标：${{ steps.pick.outputs.flavor }}
          - 体积：${{ steps.apk.outputs.size }}
          - 调试签名：安装前请先卸载官方版本（签名不同无法覆盖安装）
          - 功能：同时播放（不申请音频焦点，画中画下切到 B 站不再暂停）"

      - name: Upload workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ steps.pick.outputs.flavor }}-${{ github.run_number }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 3
          if-no-files-found: warn
