name: Build SimulPlay APK

on:
  push:
    branches: [ main, beta ]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-simulplay.yml'
      - '.github/scripts/make_manifest.py'
      - '.github/scripts/verify_apk.py'
  workflow_dispatch:
    inputs:
      channel:
        description: '发布通道（stable 写正式清单，beta 写测试清单）'
        required: true
        default: stable
        type: choice
        options:
          - stable
          - beta
      flavor:
        description: '构建目标'
        required: true
        default: mobile-arm64_v8a
        type: choice
        options:
          - mobile-arm64_v8a
          - leanback-arm64_v8a
          - mobile-armeabi_v7a
          - leanback-armeabi_v7a
      optimize:
        description: '启用 R8 压缩（体积更小，构建更慢）'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: build-${{ github.event.inputs.channel || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Pick source branch
        id: ref
        run: |
          if [ -n "${{ github.event.inputs.channel }}" ]; then
            if [ "${{ github.event.inputs.channel }}" = "beta" ]; then REF=beta; else REF=main; fi
          else
            REF="${{ github.ref_name }}"
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "source ref: $REF"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.ref }}

      - name: Resolve channel, flavor and tag
        id: pick
        run: |
          set -e
          CH="${{ github.event.inputs.channel }}"
          if [ -z "$CH" ]; then
            if [ "${{ github.ref_name }}" = "beta" ]; then CH=beta; else CH=stable; fi
          fi
          FLAVOR="${{ github.event.inputs.flavor }}"
          if [ -z "$FLAVOR" ]; then FLAVOR=mobile-arm64_v8a; fi
          case "$FLAVOR" in
            mobile-arm64_v8a)     TASK=assembleMobileArm64_v8aRelease;   OUT=mobileArm64_v8a ;;
            leanback-arm64_v8a)   TASK=assembleLeanbackArm64_v8aRelease; OUT=leanbackArm64_v8a ;;
            mobile-armeabi_v7a)   TASK=assembleMobileArmeabi_v7aRelease; OUT=mobileArmeabi_v7a ;;
            leanback-armeabi_v7a) TASK=assembleLeanbackArmeabi_v7aRelease; OUT=leanbackArmeabi_v7a ;;
            *) echo "unknown flavor: $FLAVOR"; exit 1 ;;
          esac
          if [ "$CH" = "beta" ]; then SUFFIX=-beta; else SUFFIX=""; fi
          VN=$(grep -m1 'versionName' app/build.gradle | sed 's/.*"\([^"]*\)".*/\1/')
          STAMP=$(TZ=Asia/Shanghai date +%Y%m%d%H%M)
          TAG="v${VN}${SUFFIX}-${STAMP}"
          echo "channel=$CH" >> "$GITHUB_OUTPUT"
          echo "flavor=$FLAVOR" >> "$GITHUB_OUTPUT"
          echo "task=$TASK" >> "$GITHUB_OUTPUT"
          echo "out=$OUT" >> "$GITHUB_OUTPUT"
          echo "suffix=$SUFFIX" >> "$GITHUB_OUTPUT"
          echo "version_name=$VN" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "manifest=${FLAVOR}${SUFFIX}.json" >> "$GITHUB_OUTPUT"
          echo "=== channel=$CH flavor=$FLAVOR versionName=$VN tag=$TAG manifest=${FLAVOR}${SUFFIX}.json"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Android SDK packages
        run: |
          set -e
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "ANDROID_HOME=$SDK"
          SM="$(command -v sdkmanager || true)"
          if [ -z "$SM" ]; then
            SM="$(find "$SDK/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          fi
          echo "sdkmanager=$SM"
          test -n "$SM"
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          "$SM" "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Configure signing
        id: sign
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "缺少 KEYSTORE_BASE64，无法生成稳定签名的安装包"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/simulplay.jks"
          {
            echo "sdk.dir=${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
            echo "storeFile=$RUNNER_TEMP/simulplay.jks"
            echo "keyAlias=${{ secrets.KEY_ALIAS }}"
            echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
          } > local.properties
          sed 's/storePassword=.*/storePassword=***/' local.properties
          SHA=$(keytool -list -v -keystore "$RUNNER_TEMP/simulplay.jks" \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" -alias "${{ secrets.KEY_ALIAS }}" \
            | sed -n 's/.*SHA256: //p' | head -n 1)
          echo "keystore SHA256: $SHA"
          echo "signer_sha256=$SHA" >> "$GITHUB_OUTPUT"

      - name: Build APK
        env:
          WEBHTV_RELEASE_TAG: ${{ steps.pick.outputs.tag }}
          WEBHTV_APK_SUFFIX: ${{ steps.pick.outputs.suffix }}
        run: |
          set -e
          EXTRA=""
          if [ "${{ github.event.inputs.optimize }}" != "true" ]; then EXTRA="-PfastRelease=true"; fi
          echo "gradle args: $EXTRA"
          bash gradlew ${{ steps.pick.outputs.task }} $EXTRA --no-daemon --stacktrace

      - name: Make update manifest
        id: manifest
        env:
          TAG: ${{ steps.pick.outputs.tag }}
          CHANNEL: ${{ steps.pick.outputs.channel }}
          MANIFEST: ${{ steps.pick.outputs.manifest }}
          VERSION_NAME: ${{ steps.pick.outputs.version_name }}
        run: |
          set -e
          APK=$(find "app/build/outputs/apk/${{ steps.pick.outputs.out }}/release" -name '*.apk' | head -n 1)
          test -n "$APK"
          echo "apk=$APK"
          AAPT=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -type f -name aapt2 | sort | tail -n 1)
          CODE=$("$AAPT" dump badging "$APK" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -n 1)
          echo "versionCode=$CODE"
          NOTES=$(git log -3 --pretty='- %s')
          python3 .github/scripts/make_manifest.py \
            --apk "$APK" \
            --channel "$CHANNEL" \
            --tag "$TAG" \
            --version-name "$VERSION_NAME" \
            --code "$CODE" \
            --repo "${GITHUB_REPOSITORY}" \
            --notes "$NOTES" \
            --out "$MANIFEST"
          cat "$MANIFEST"
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "size=$(du -h "$APK" | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Verify APK (signature, version and update URL)
        env:
          APK: ${{ steps.manifest.outputs.apk_path }}
        run: |
          set -e
          python3 .github/scripts/verify_apk.py \
            --apk "$APK" \
            --expect-sha256 "${{ steps.sign.outputs.signer_sha256 }}" \
            --expect-code "${{ steps.manifest.outputs.code }}" \
            --expect-version "${{ steps.pick.outputs.version_name }}"

      - name: Publish release and update channel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.pick.outputs.tag }}
          CHANNEL: ${{ steps.pick.outputs.channel }}
          MANIFEST: ${{ steps.pick.outputs.manifest }}
          APK: ${{ steps.manifest.outputs.apk_path }}
        run: |
          set -e
          if [ "$CHANNEL" = "beta" ]; then FLAG=--prerelease; else FLAG=--latest; fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$MANIFEST" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" $FLAG \
              --title "$TAG" \
              --notes "同时播放版自动构建（$CHANNEL 通道）"
            gh release upload "$TAG" "$APK" "$MANIFEST" --repo "$GITHUB_REPOSITORY" --clobber
          fi
          if gh release view update-channel --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "update-channel 已存在"
          else
            gh release create update-channel --repo "$GITHUB_REPOSITORY" --prerelease \
              --title "Update channel manifests" \
              --notes "App 内「检查更新」读取的清单目录，不对外提供安装包。"
          fi
          gh release upload update-channel "$MANIFEST" --repo "$GITHUB_REPOSITORY" --clobber
          echo "published $TAG -> update-channel/$MANIFEST"

      - name: Upload workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ steps.pick.outputs.flavor }}-${{ steps.pick.outputs.channel }}-${{ github.run_number }}
          path: |
            ${{ steps.manifest.outputs.apk_path }}
            ${{ steps.pick.outputs.manifest }}
          retention-days: 3
          if-no-files-found: warn
