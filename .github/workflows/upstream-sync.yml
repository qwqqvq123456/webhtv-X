name: Sync Upstream

on:
  schedule:
    # 每 6 小时同步一次（UTC 0/6/12/18 点 23 分，北京时间 08:23 / 14:23 / 20:23 / 02:23）
    # 上游发布新版本后最多 6 小时内就会跟进，版本号不会长时间落后
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - branch: main
            channel: stable
          - branch: beta
            channel: beta
    steps:
      - name: Merge upstream into ${{ matrix.branch }}
        id: merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          code=$(curl -sS -o response.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/merge-upstream" \
            -d '{"branch":"${{ matrix.branch }}"}')
          echo "HTTP ${code}"
          cat response.json
          echo "code=${code}" >> "$GITHUB_OUTPUT"

      - name: Open issue on conflict
        if: steps.merge.outputs.code != '200'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --repo "${GITHUB_REPOSITORY}" \
            --title "上游 ${{ matrix.branch }} 同步失败 $(date -u +%Y-%m-%d)" \
            --body "自动同步 ${{ matrix.branch }} 返回 HTTP ${{ steps.merge.outputs.code }}，通常是上游改动了 PlayerSetting / PlayerManager / ExoUtil / PlaybackActivity / Github 之一。请本地 git fetch upstream && git merge upstream/${{ matrix.branch }}，按同时播放补丁的意图解决冲突后推回 ${{ matrix.branch }}，再关闭本 issue。"
          exit 1

      - name: Trigger ${{ matrix.channel }} build
        if: steps.merge.outputs.code == '200'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          MERGE=$(python3 -c "import json;print(json.load(open('response.json')).get('merge_type',''))")
          echo "merge_type=$MERGE"

          if [ "${{ matrix.channel }}" = "beta" ]; then PRE='.isPrerelease == true'; else PRE='.isPrerelease == false'; fi
          JQ="[.[] | select(.tagName | startswith(\"v\")) | select($PRE)][0].tagName // empty"
          UP=$(gh release list --repo Silent1566/webhtv --limit 60 --json tagName,isPrerelease --jq "$JQ" 2>/dev/null || true)
          OURS=$(gh release list --repo "${GITHUB_REPOSITORY}" --limit 60 --json tagName,isPrerelease --jq "$JQ" 2>/dev/null || true)
          echo "upstream latest=$UP / ours=$OURS"

          if [ "$MERGE" = "none" ] && [ "$UP" = "$OURS" ] && [ -n "$UP" ]; then
            echo "上游无新提交且版本号已一致，跳过构建"
            exit 0
          fi
          if [ -n "$UP" ] && [ "$UP" != "$OURS" ]; then
            echo "检测到上游版本号更新：$OURS -> $UP"
          fi
          gh workflow run build-simulplay.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref ${{ matrix.branch }} \
            -f channel=${{ matrix.channel }} \
            -f flavor=mobile-arm64_v8a || true
