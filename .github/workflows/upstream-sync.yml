name: Sync Upstream

on:
  schedule:
    # 每天 UTC 19:23（北京时间 03:23）检查上游
    - cron: '23 19 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Merge upstream into fork
        id: merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          code=$(curl -sS -o response.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/merge-upstream" \
            -d '{"branch":"main"}')
          echo "HTTP ${code}"
          cat response.json
          echo "code=${code}" >> "$GITHUB_OUTPUT"

      - name: Open issue on conflict
        if: steps.merge.outputs.code != '200'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --repo "${GITHUB_REPOSITORY}" \
            --title "上游同步失败 $(date -u +%Y-%m-%d)" \
            --body "自动同步返回 HTTP ${{ steps.merge.outputs.code }}。

多数情况是上游改动了补丁涉及的四个文件之一：
- \`app/src/main/java/com/fongmi/android/tv/setting/PlayerSetting.java\`
- \`app/src/main/java/com/fongmi/android/tv/player/PlayerManager.java\`
- \`app/src/main/java/com/fongmi/android/tv/player/exo/ExoUtil.java\`
- \`app/src/main/java/com/fongmi/android/tv/ui/activity/PlaybackActivity.java\`

处理方式：本地 \`git pull\` 后 \`git merge upstream/main\`，按 \`simulplay.patch\` 的意图解决冲突（保留「同时播放」判断），推回 main 后关闭本 issue。" || true
          exit 1

      - name: Trigger APK build
        if: steps.merge.outputs.code == '200'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run build-simulplay.yml --repo "${GITHUB_REPOSITORY}" || true
